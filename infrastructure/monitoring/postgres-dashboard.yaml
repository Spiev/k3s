# Custom Postgres dashboard — hand-built, NOT an imported community dashboard.
# Why custom: community postgres_exporter dashboards (grafana.com IDs 9628,
# 14114, 18316) use the deprecated 'graph'/'singlestat' Angular panel types,
# which this Grafana (13.x) no longer ships — they would render blank/broken.
# A newer one (24298) relies on custom queries.yaml-based metrics we don't
# collect (pg_repack, pg_hba, SSL expiry, etc.). This dashboard only uses
# metrics confirmed present in our actual default-config postgres_exporter
# v0.20.1 output (see docs/decisions/cluster-monitoring.md) with modern
# timeseries panels, filterable by the $job template variable (one per app:
# immich/immich-postgres, teslamate/teslamate-db, paperless/paperless-db).
# Discovered automatically by the Grafana sidecar (label grafana_dashboard=1,
# searchNamespace: ALL — chart default).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgres
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    grafana_dashboard: "1"
