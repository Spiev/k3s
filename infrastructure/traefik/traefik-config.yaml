apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app: traefik
    managed-by: flux
spec:
  valuesContent: |-
    # externalTrafficPolicy: Local — preserve the real client IP.
    # With the default (Cluster), k3s ServiceLB SNATs the source IP to an internal
    # node IP, so Traefik's X-Forwarded-For carries a Flannel IP, not the client —
    # the per-IP rate-limit would then bucket ALL clients together. Local disables
    # SNAT (lossless on a single node: Traefik runs there anyway). Persisted here in
    # the HelmChartConfig so it survives Helm re-renders (a kubectl patch would not).
    service:
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        # While nginx is the edge it sets X-Forwarded-For; trustedIPs must list the
        # nginx host so Traefik trusts that XFF. AT CUTOVER (traffic direct from the
        # Fritzbox, nginx gone) trustedIPs is REMOVED — Traefik then sets XFF itself
        # from the real connection IP (needs externalTrafficPolicy: Local above), and
        # the rate-limit middlewares read it via ipStrategy.depth:1. So: keep the
        # trustedIPs block below UNTIL cutover, delete it as part of the flip.
        forwardedHeaders:
          trustedIPs:
            - "${PROXY_IP}/32"
        # Bound how long a client may take to send a request / receive a response.
        # Without this, readTimeout defaults to 0 (unlimited) — a Slowloris client
        # could hold a connection open indefinitely. readTimeout covers the full
        # request incl. body, so it is sized to the largest legitimate slow upload
        # (Seafile/Immich; nginx used 300s) rather than tighter.
        # See docs/decisions/ingress-connection-limiting.md.
        transport:
          respondingTimeouts:
            readTimeout: 300s
            writeTimeout: 300s
            idleTimeout: 180s
      websecure:
        forwardedHeaders:
          trustedIPs:
            - "${PROXY_IP}/32"
        transport:
          respondingTimeouts:
            readTimeout: 300s
            writeTimeout: 300s
            idleTimeout: 180s
