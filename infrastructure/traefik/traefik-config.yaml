apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
  labels:
    app: traefik
    managed-by: flux
spec:
  valuesContent: |-
    # Access log (JSON → stdout, visible via `kubectl -n kube-system logs deploy/traefik`).
    # Enabled for operational debugging: shows per-request client IP, host, path,
    # status code, duration and backend — the first thing to check when a service
    # misbehaves after a change. headers keep X-Forwarded-For (real client IP thanks
    # to externalTrafficPolicy: Local) + User-Agent. Not a security tool (that's a
    # later CrowdSec/Traefik-bouncer job); just visibility.
    # NOTE: key is top-level `accessLog:` in the traefik chart (v41.x) — NOT
    # `logs.access` (that silently no-ops; Helm ignores unknown values).
    accessLog:
      enabled: true
      format: json
      fields:
        headers:
          defaultMode: drop
          names:
            X-Forwarded-For: keep
            User-Agent: keep
    # externalTrafficPolicy: Local — preserve the real client IP.
    # With the default (Cluster), k3s ServiceLB SNATs the source IP to an internal
    # node IP, so Traefik's X-Forwarded-For carries a Flannel IP, not the client —
    # the per-IP rate-limit would then bucket ALL clients together. Local disables
    # SNAT (lossless on a single node: Traefik runs there anyway). Persisted here in
    # the HelmChartConfig so it survives Helm re-renders (a kubectl patch would not).
    service:
      spec:
        externalTrafficPolicy: Local
    # Pin Traefik to the Server-Node (k3s), the single ingress-entry node where the
    # Fritzbox forwards :80/:443. externalTrafficPolicy: Local only preserves the
    # real client IP when the entry node == the Traefik-pod node; if Traefik lands
    # on the agent (k3s-a1), kube-proxy hops cross-node and SNATs → access log +
    # per-IP rate-limit see only the svclb pod IP (10.42.x). Traefik already
    # tolerates the control-plane NoSchedule taint, so it schedules here fine.
    nodeSelector:
      kubernetes.io/hostname: k3s
    ports:
      web:
        # Cutover done: traffic now arrives DIRECT from the Fritzbox (nginx bypassed),
        # so forwardedHeaders/trustedIPs was removed — Traefik sets X-Forwarded-For
        # itself from the real connection IP (relies on externalTrafficPolicy: Local
        # above), and the rate-limit middlewares read it via ipStrategy.depth:1.
        # Bound how long a client may take to send a request / receive a response.
        # Without this, readTimeout defaults to 0 (unlimited) — a Slowloris client
        # could hold a connection open indefinitely. readTimeout covers the full
        # request incl. body, so it is sized to the largest legitimate slow upload
        # (Seafile/Immich; nginx used 300s) rather than tighter.
        # See docs/decisions/ingress-connection-limiting.md.
        transport:
          respondingTimeouts:
            readTimeout: 300s
            writeTimeout: 300s
            idleTimeout: 180s
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 300s
            writeTimeout: 300s
            idleTimeout: 180s
