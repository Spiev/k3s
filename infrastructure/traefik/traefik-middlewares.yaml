---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: false
    forceSTSHeader: true
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow, nosnippet, noarchive"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-general
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  rateLimit:
    average: 20
    burst: 50
    period: 1s
    # Edge = Traefik (post-flip): traffic arrives direct via Fritzbox NAT, no
    # X-Forwarded-For. Omitting sourceCriterion makes Traefik group by the real
    # TCP source IP (ConnRemoteAddr, NAT-preserved) — do NOT use ipStrategy.depth
    # here (it would read a now-absent/spoofable XFF header).
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-login
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  rateLimit:
    average: 5
    burst: 10
    period: 1m
    # See rate-limit-general: group by real source IP, no ipStrategy.depth.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-default
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  buffering:
    maxRequestBodyBytes: 10485760
    memRequestBodyBytes: 2097152
    retryExpression: "IsNetworkError() && Attempts() < 3"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-upload
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  buffering:
    maxRequestBodyBytes: 104857600
    memRequestBodyBytes: 10485760
    retryExpression: "IsNetworkError() && Attempts() < 3"
