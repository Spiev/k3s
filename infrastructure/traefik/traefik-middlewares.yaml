---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: false
    forceSTSHeader: true
    frameDeny: true
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: "strict-origin-when-cross-origin"
    permissionsPolicy: "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    customResponseHeaders:
      X-Robots-Tag: "noindex, nofollow, nosnippet, noarchive"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-general
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  rateLimit:
    average: 20
    burst: 50
    period: 1s
    # Edge = Traefik (post-flip). With the Traefik Service on
    # externalTrafficPolicy: Local (no SNAT), Traefik itself sets a correct
    # X-Forwarded-For carrying the real client IP; RemoteAddr is only the
    # internal pod IP. So KEEP ipStrategy.depth: 1 to read the real client IP
    # from XFF — verified empirically (depth:1 → per-client 429 works; dropping
    # it collapses all clients onto the pod IP). Requires externalTrafficPolicy:
    # Local on svc/traefik (kube-system).
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-login
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  rateLimit:
    average: 5
    burst: 10
    period: 1m
    # See rate-limit-general: keep depth:1 (reads real client IP from Traefik's
    # own XFF under externalTrafficPolicy: Local).
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-immich
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  rateLimit:
    # Immich fires many parallel API calls (gallery, thumbnails) on load — the
    # general 20/s limit trips 429. Matches the old nginx immich_limit (100/s).
    average: 100
    burst: 200
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-default
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  buffering:
    maxRequestBodyBytes: 10485760
    memRequestBodyBytes: 2097152
    retryExpression: "IsNetworkError() && Attempts() < 3"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit-upload
  namespace: kube-system
  labels:
    app: traefik-middlewares
spec:
  buffering:
    maxRequestBodyBytes: 104857600
    memRequestBodyBytes: 10485760
    retryExpression: "IsNetworkError() && Attempts() < 3"
