apiVersion: v1
kind: Namespace
metadata:
  name: pihole
  labels:
    app: pihole
    type: service
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-config-new
  namespace: pihole
  labels:
    app: pihole
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pihole
  strategy:
    type: Recreate      # RWO PVC — nur ein Pod gleichzeitig
  template:
    metadata:
      labels:
        app: pihole
    spec:
      containers:
        - name: pihole
          image: pihole/pihole:2026.10.1@sha256:30f803ad5dd60ff96cc0a63008a2e9271af481c1b0399a182192b2e91152c1f9
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: FTLCONF_webserver_api_password
            - name: PIHOLE_DNS_
              value: "8.8.8.8;8.8.4.4;2001:4860:4860::8888;2001:4860:4860::8844"
            - name: FTLCONF_LOCAL_IPV6
              value: "::"          # FTL auf allen IPv6-Interfaces lauschen
            - name: IPv6
              value: "true"
            - name: FTLCONF_webserver_port
              value: "8080"
          ports:
            - containerPort: 53
              protocol: TCP
              name: dns-tcp
            - containerPort: 53
              protocol: UDP
              name: dns-udp
            - containerPort: 8080
              protocol: TCP
              name: web
          securityContext:
            capabilities:
              add:
                - NET_ADMIN   # DNS-Listener (+ optionales DHCP)
                - SYS_NICE    # CPU-Scheduling
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
          readinessProbe:
            httpGet:
              path: /admin
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: pihole-config-new
---
# DNS-Service: LoadBalancer mit Dual-Stack → Pi-hole bekommt IPv4 + IPv6 vom Node
apiVersion: v1
kind: Service
metadata:
  name: pihole-dns
  namespace: pihole
  labels:
    app: pihole
spec:
  type: LoadBalancer
  ipFamilyPolicy: PreferDualStack
  ipFamilies:
    - IPv4
    - IPv6
  selector:
    app: pihole
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
---
# Web-Service: ClusterIP → Traefik Ingress (pihole-ingress.yaml)
apiVersion: v1
kind: Service
metadata:
  name: pihole-web
  namespace: pihole
  labels:
    app: pihole
spec:
  selector:
    app: pihole
  ports:
    - port: 8080
      targetPort: 8080
---
# ─── Pi-hole HA (StatefulSet, one pod per node) ─────────────────────────────
# Migration in progress, see docs/services/pihole.md → "HA migration".
# Phase 1: StatefulSet runs alongside the legacy Deployment above. Its pods
# carry `app.kubernetes.io/name: pihole` (not `app: pihole`), so the
# pihole-dns / pihole-web Services above do NOT route to them yet.

# Headless Service → stable per-pod DNS names (via CoreDNS, not Pi-hole):
#   pihole-0.pihole-headless.pihole.svc.cluster.local (primary)
#   pihole-1.pihole-headless.pihole.svc.cluster.local (replica)
apiVersion: v1
kind: Service
metadata:
  name: pihole-headless
  namespace: pihole
  labels:
    app: pihole
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: pihole
  ports:
    - name: web
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  serviceName: pihole-headless
  replicas: 2
  # A pod only counts as available after answering DNS for 30s →
  # the rolling update does not move on to the second pod too early.
  minReadySeconds: 30
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
  # Highest ordinal first, one pod at a time, waiting for Ready in between.
  # This is what keeps DNS up during Renovate/Flux image updates.
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pihole
              topologyKey: kubernetes.io/hostname
      containers:
        - name: pihole
          image: pihole/pihole:2026.10.1@sha256:30f803ad5dd60ff96cc0a63008a2e9271af481c1b0399a182192b2e91152c1f9
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-secret
                  key: FTLCONF_webserver_api_password
            - name: FTLCONF_webserver_port
              value: "8080"
          ports:
            - containerPort: 53
              protocol: TCP
              name: dns-tcp
            - containerPort: 53
              protocol: UDP
              name: dns-udp
            - containerPort: 8080
              protocol: TCP
              name: web
          securityContext:
            capabilities:
              add:
                - NET_ADMIN   # DNS-Listener (+ optionales DHCP)
                - SYS_NICE    # CPU-Scheduling
          volumeMounts:
            - name: config
              mountPath: /etc/pihole
          # Ready = FTL answers DNS (same check as the image's HEALTHCHECK),
          # not just "web UI is up".
          readinessProbe:
            exec:
              command: ["dig", "+short", "+norecurse", "+retry=0", "+time=2", "@127.0.0.1", "pi.hole"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
  volumeClaimTemplates:
    # → PVCs config-pihole-0 / config-pihole-1, each pinned to its node by local-path
    - metadata:
        name: config
        labels:
          app: pihole
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
# Node drains / k3s upgrades may never take down both Pi-holes at once
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pihole
  namespace: pihole
  labels:
    app: pihole
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole
---
# Config sync pihole-0 (primary) → pihole-1 (replica) via Teleporter API.
# Make changes ONLY on pihole-0 — the replica is overwritten on every run.
# Sync on demand after changes:
#   kubectl create job -n pihole --from=cronjob/nebula-sync nebula-sync-manual
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nebula-sync
  namespace: pihole
  labels:
    app: nebula-sync
spec:
  schedule: "30 */6 * * *"     # RUN_GRAVITY re-downloads blocklists on the replica → not hourly
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: nebula-sync
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: nebula-sync
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          containers:
            - name: nebula-sync
              image: ghcr.io/lovelaze/nebula-sync:v0.11.3@sha256:59c51378460f6dc8707cc91a16aa62dff5cd5dd8b39353658b45cb00d6bfddd8
              env:
                - name: PIHOLE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: pihole-secret
                      key: FTLCONF_webserver_api_password
                - name: PRIMARY
                  value: "http://pihole-0.pihole-headless.pihole.svc.cluster.local:8080|$(PIHOLE_PASSWORD)"
                - name: REPLICAS
                  value: "http://pihole-1.pihole-headless.pihole.svc.cluster.local:8080|$(PIHOLE_PASSWORD)"
                - name: FULL_SYNC
                  value: "true"
                - name: RUN_GRAVITY
                  value: "true"
                - name: TZ
                  value: "Europe/Berlin"
                # no CRON → nebula-sync runs once and exits (Kubernetes does the scheduling)
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
