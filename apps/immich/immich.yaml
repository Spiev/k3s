# Immich on k3s (node: k3s-a1). Migrated from Docker (~/docker/immich).
# library + postgres data via `mv` into local-path PVCs (gratis, same partition).
# See .hermes/plans/2026-09-17_phase2-k3s-agent-join-ha-immich.md (Block 4).
#
# CRITICAL: postgres image MUST stay the exact vectorchord tag used in Docker,
# otherwise the migrated data dir won't load.
apiVersion: v1
kind: Namespace
metadata:
  name: immich
  labels:
    app: immich
    type: service
---
# ---------- PVCs ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library     # mv target: ~/docker/immich/library (~1.5 TB)
  namespace: immich
  labels: { app: immich }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 1700Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres    # mv target: ~/docker/immich/postgres
  namespace: immich
  labels: { app: immich-db }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 30Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-model-cache
  namespace: immich
  labels: { app: immich-ml }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources: { requests: { storage: 5Gi } }
---
# ---------- Postgres (vectorchord — EXACT image) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
  labels: { app: immich-db }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: immich-db } }
  template:
    metadata:
      labels: { app: immich-db }
    spec:
      nodeSelector: { kubernetes.io/hostname: k3s-a1 }
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:1a078b237c1d9b420b0ee59147386b4aa60d3a07a8e6a402fc84a57e41b043a4
          envFrom:
            - secretRef: { name: immich-secrets }
          volumeMounts:
            - { name: pgdata, mountPath: /var/lib/postgresql/data }
        # Dedicated least-privilege (pg_monitor role) metrics sidecar — see
        # docs/decisions/cluster-monitoring.md. Connects via localhost (shared
        # pod network), DB name doesn't matter (pg_stat_database is cluster-wide).
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          args: ['--datasource.uri=localhost:5432/postgres?sslmode=disable']
          env:
            - name: DATA_SOURCE_USER
              value: monitoring
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef: { name: immich-monitoring-secrets, key: DATA_SOURCE_PASS }
          ports:
            - { name: metrics, containerPort: 9187 }
          resources:
            requests: { cpu: 10m, memory: 20Mi }
            limits: { cpu: 20m, memory: 40Mi }
      volumes:
        - name: pgdata
          persistentVolumeClaim: { claimName: immich-postgres }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
  labels: { app: immich-db }
spec:
  selector: { app: immich-db }
  ports: [ { port: 5432, targetPort: 5432 } ]
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: immich-postgres
  namespace: immich
  labels: { app: immich-db }
spec:
  selector:
    matchLabels: { app: immich-db }
  podMetricsEndpoints:
    - port: metrics
---
# ---------- Redis (valkey) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
  labels: { app: immich-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: immich-redis } }
  template:
    metadata:
      labels: { app: immich-redis }
    spec:
      nodeSelector: { kubernetes.io/hostname: k3s-a1 }
      containers:
        - name: redis
          image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: immich
  labels: { app: immich-redis }
spec:
  selector: { app: immich-redis }
  ports: [ { port: 6379, targetPort: 6379 } ]
---
# ---------- Machine Learning ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
  labels: { app: immich-ml }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: immich-ml } }
  template:
    metadata:
      labels: { app: immich-ml }
    spec:
      nodeSelector: { kubernetes.io/hostname: k3s-a1 }
      containers:
        - name: immich-ml
          image: ghcr.io/immich-app/immich-machine-learning:v3.3.6@sha256:14367bfb374b8576ddf49abd67c5ca0190a4c7fcf6303cdad65d7f7bf1a50bc2
          envFrom:
            - secretRef: { name: immich-secrets }
          volumeMounts:
            - { name: cache, mountPath: /cache }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: immich-model-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
  labels: { app: immich-ml }
spec:
  selector: { app: immich-ml }
  ports: [ { port: 3003, targetPort: 3003 } ]
---
# ---------- Immich Server ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  labels: { app: immich-server }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: immich-server } }
  template:
    metadata:
      labels: { app: immich-server }
    spec:
      nodeSelector: { kubernetes.io/hostname: k3s-a1 }
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:v3.3.6@sha256:e1981983b1c13f6024b57d72e7ecae3342eed1581201ab09fb248932d86c593a
          envFrom:
            - secretRef: { name: immich-secrets }
          ports: [ { containerPort: 2283 } ]
          volumeMounts:
            - { name: library, mountPath: /data }
      volumes:
        - name: library
          persistentVolumeClaim: { claimName: immich-library }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
  labels: { app: immich-server }
spec:
  selector: { app: immich-server }
  ports: [ { port: 2283, targetPort: 2283 } ]
