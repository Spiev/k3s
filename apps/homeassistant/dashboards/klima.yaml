# =============================================================================
# KLIMA-DASHBOARD
# =============================================================================
# Eigenstaendiges Lovelace-Dashboard (Sidebar-Eintrag "09 Klima").
# Konvertiert aus dem urspruenglich UI-/Storage-verwalteten Dashboard
# (.storage/lovelace.dashboard_klima), damit es in Git versioniert ist.
# Tile-Cards + Statistics-Graph zeigen pro Raum den Live-Heizstatus
# (binary_sensor.heizung_<raum>_aktiv) und die Heizdauer/Tag
# (sensor.heizdauer_<raum>_heute), beide definiert in templates.yaml/sensor.yaml.
# =============================================================================
title: 09 Klima
views:
- title: Home
  path: klima
  icon: mdi:home-thermometer
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Außen
      heading_style: title
      icon: mdi:sun-thermometer
    - graph: line
      type: sensor
      entity: sensor.outside_temperature
      name: Temperatur
      detail: 1
      hours_to_show: 168
    - graph: line
      type: sensor
      entity: sensor.outside_humidity
      name: Luftfeuchtigkeit
      detail: 2
      hours_to_show: 168
    column_span: 4
  - type: grid
    cards:
    - type: heading
      icon: mdi:account
      heading: Stefan
      heading_style: title
    - graph: line
      type: sensor
      entity: sensor.tado_smart_radiator_thermostat_va0509365504_current_temperature
      detail: 1
      hours_to_show: 48
      grid_options:
        columns: 6
        rows: 2
      name: Temperatur
    - graph: line
      type: sensor
      entity: sensor.tado_smart_radiator_thermostat_va0509365504_current_humidity
      detail: 1
      hours_to_show: 48
      grid_options:
        columns: 6
        rows: 2
      name: Luftfeuchtigkeit
    - type: tile
      name: Soll-Temperatur
      grid_options:
        columns: full
      entity: input_number.soll_temp_stefan
      vertical: false
      features:
      - type: numeric-input
        style: buttons
      features_position: inline
    - type: tile
      entity: binary_sensor.heizung_stefan_aktiv
      name: Heizung aktiv
      vertical: false
    - type: statistics-graph
      entities:
      - sensor.heizdauer_stefan_heute
      stat_types:
      - mean
      days_to_show: 60
      title: Heizdauer (Stunden/Tag)
